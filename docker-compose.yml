services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: caro-server
    ports:
      - "1999:1999"  # WebSocket (typed protobuf binary frames)
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: caro-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
